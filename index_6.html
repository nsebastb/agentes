  /* Avatar: imagen + boca SVG en el mismo cuadro (1254×1254) */
  .stage{position:fixed;left:50%;z-index:2;
    width:min(86vw,48dvh,540px);aspect-ratio:1/1;
    bottom:calc(env(safe-area-inset-bottom) + var(--dockH) + 2dvh);
    transform:translateX(-50%);}
  .shadow{position:absolute;left:22%;right:22%;bottom:3%;height:7%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(90,50,30,.35),rgba(90,50,30,0));filter:blur(2px);}
  .avatar{position:absolute;inset:0;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 92%;}
  .avatar img,.avatar svg{position:absolute;inset:0;width:100%;height:100%;}
  .avatar img{filter:drop-shadow(0 10px 16px rgba(120,40,20,.18));}
  @keyframes bob{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(-1.2%) scaleY(1.008);}}
  @media (prefers-reduced-motion:reduce){.avatar{animation:none;}}

  .topbar{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;z-index:7;
    display:flex;align-items:center;justify-content:space-between;pointer-events:none;}
  .logo-badge{display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:14px;
    background:rgba(24,26,34,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 20px rgba(0,0,0,.22);}
  .logo-mark{width:22px;height:22px;flex:0 0 auto;}
  button.logo-badge{pointer-events:auto;cursor:pointer;font:inherit;color:#fff;transition:transform .18s,box-shadow .2s,background .2s;}
  button.logo-badge:hover{background:rgba(24,26,34,.97);box-shadow:0 8px 24px rgba(0,0,0,.3);}
  button.logo-badge:active{transform:scale(.96);}
  button.logo-badge:focus-visible{outline:3px solid rgba(226,35,26,.6);outline-offset:3px;}
  button.logo-badge:hover .logo{opacity:.85;}
  .logo-mark{transition:transform .3s;}
  .logo{width:118px;height:auto;display:block;}
  .brand{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:0;right:0;display:flex;gap:9px;align-items:center;justify-content:center;
    z-index:5;user-select:none;font-weight:400;letter-spacing:.22em;font-size:10.5px;color:#7a6f66;text-transform:uppercase;
    text-shadow:0 1px 6px rgba(255,255,255,.8);}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--claro-red);box-shadow:0 0 12px rgba(226,35,26,.7);}
  .brand b{color:var(--ink);font-weight:700;letter-spacing:.16em;}

  /* Panel de control inferior */
  .dock{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;
    margin:0 auto;max-width:480px;
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 16px;
    background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.75);border-radius:26px;box-shadow:0 14px 44px rgba(90,50,30,.18);}
  .greeting{font-size:24px;font-weight:300;color:var(--ink);}
  .greeting b{font-weight:900;color:var(--claro-red);}
  .status{font-size:14px;color:var(--grey);min-height:20px;text-align:center;transition:color .25s;}
  .status.live{color:var(--claro-red);font-weight:500;}
  .row{width:100%;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  button{font-family:var(--font);cursor:pointer;border:none;}
  .btn-primary{display:inline-flex;width:100%;justify-content:center;align-items:center;gap:10px;padding:17px 20px;font-size:16px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--claro-red),var(--red-2));border-radius:100px;
    box-shadow:0 8px 22px rgba(226,35,26,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .25s,opacity .2s;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(255,90,77,.5);}
  .btn-primary:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}
  .btn-ghost{display:none;align-items:center;gap:8px;padding:16px 24px;font-size:15px;font-weight:500;color:var(--grey);
    background:#fff;border:1px solid var(--line);border-radius:100px;transition:.2s;}
  .btn-ghost:hover{color:var(--ink);border-color:rgba(226,35,26,.5);}
  .btn-ghost.show{display:inline-flex;}
  .icon-btn{display:none;align-items:center;justify-content:center;width:56px;height:56px;flex:0 0 auto;border-radius:50%;
    background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 10px rgba(27,34,51,.06);transition:.18s;}
  .icon-btn.show{display:inline-flex;}
  .icon-btn:hover{border-color:rgba(226,35,26,.5);}
  .icon-btn.active{background:var(--claro-red);border-color:var(--claro-red);color:#fff;box-shadow:0 6px 18px rgba(226,35,26,.4);}
  .reset-btn{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.7);color:var(--ink);box-shadow:0 4px 16px rgba(27,34,51,.16);transition:transform .25s,color .18s;}
  .reset-btn:hover{color:var(--claro-red);transform:rotate(-35deg);}
  #toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + var(--dockGap) + var(--dockH) + 14px);left:50%;transform:translateX(-50%) translateY(20px);max-width:460px;width:calc(100% - 24px);
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--claro-red);border-radius:12px;padding:14px 18px;
    font-size:13.5px;line-height:1.5;color:var(--ink);box-shadow:0 12px 40px rgba(27,34,51,.16);opacity:0;pointer-events:none;transition:.3s;z-index:20;text-align:left;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast b{color:var(--claro-red);}

  /* Pantallas bajas (iPhone SE, etc.) */
  @media (max-height:700px){
    :root{--dockH:168px;}
    .brand{display:none;}
    .dock{padding:14px 14px 12px;gap:8px;}
    .greeting{font-size:21px;}
    .btn-primary{padding:15px 20px;}
  }

  /* ===== Botón y panel de conversación ===== */
  .top-actions{display:flex;gap:10px;pointer-events:auto;}
  .chat-btn{position:relative;}
  .chat-btn .badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--claro-red);color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;
    box-shadow:0 2px 6px rgba(226,35,26,.45);display:none;}
  .chat-btn .badge.show{display:block;}
  .chat-backdrop{display:none !important;position:fixed;inset:0;z-index:30;background:rgba(20,16,14,.28);opacity:0;pointer-events:none;transition:opacity .25s;}
  .chat-backdrop.open{opacity:1;pointer-events:auto;}
  .chat-panel{position:fixed;z-index:31;left:0;right:0;bottom:0;height:min(72dvh,640px);
    display:flex;flex-direction:column;background:#fff;border-radius:24px 24px 0 0;
    box-shadow:0 -12px 40px rgba(27,34,51,.22);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    padding-bottom:env(safe-area-inset-bottom);}
  .chat-panel.open{transform:translateY(0);}
  .chat-grab{width:40px;height:5px;border-radius:3px;background:#D7DEE9;margin:9px auto 0;}
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 12px 20px;border-bottom:1px solid #EEF1F6;}
  .chat-head h2{font-size:17px;font-weight:700;color:var(--ink);}
  .chat-head h2 span{display:block;font-size:12px;font-weight:400;color:var(--grey);margin-top:1px;}
  .chat-close{width:40px;height:40px;border-radius:50%;background:#F3F5F9;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:.18s;}
  .chat-close:hover{background:#E9EDF3;color:var(--claro-red);}
  .chat-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 20px;display:flex;flex-direction:column;gap:10px;background:#FAFBFD;}
  .chat-empty{margin:auto;text-align:center;color:var(--grey);font-size:14px;line-height:1.5;max-width:260px;}
  .chat-empty svg{display:block;margin:0 auto 10px;color:#C3CBD8;}
  .msg{display:flex;flex-direction:column;max-width:82%;}
  .msg .who{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--grey);margin:0 6px 3px;}
  .msg .bubble{padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;}
  .msg.ai{align-self:flex-start;}
  .msg.ai .bubble{background:#fff;border:1px solid #E6EAF1;color:var(--ink);border-bottom-left-radius:6px;}
  .msg.ai .who{color:var(--claro-red);}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.user .bubble{background:linear-gradient(135deg,var(--claro-red),var(--red-2));color:#fff;border-bottom-right-radius:6px;}
  .msg .time{font-size:10.5px;color:#9AA4B5;margin:3px 8px 0;}
  .chat-sep{align-self:center;font-size:11px;color:#9AA4B5;background:#EEF1F6;padding:4px 10px;border-radius:10px;}
  @media (orientation:landscape) and (min-width:700px){
    .chat-panel{left:auto;top:16px;right:16px;bottom:16px;height:auto;width:min(400px,40vw);border-radius:22px;transform:translateX(calc(100% + 24px));}
    .chat-panel.open{transform:translateX(0);}
    .chat-grab{display:none;}
  }
  /* ===== Tótem / vertical: avatar más arriba, panel despegado del piso ===== */
  .stage,.dock,.chat-panel{transition:top .4s cubic-bezier(.2,.8,.2,1),width .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .3s;}
  @media (orientation:portrait){
    :root{--dockGap:max(28px,7dvh);--sw:min(84vw,46dvh,900px);--swc:min(42vw,24dvh,560px);--topSafe:calc(env(safe-area-inset-top) + 80px);}
    .dock{bottom:calc(env(safe-area-inset-bottom) + var(--dockGap));}
    .stage{bottom:auto;width:var(--sw);
      top:calc(100dvh - env(safe-area-inset-bottom) - var(--dockGap) - var(--dockH) - 4dvh - var(--sw));}
    /* Con el chat abierto: Clarito sube y se achica, el chat ocupa el espacio entre él y el panel */
    body.chat-open .stage{width:var(--swc);top:var(--topSafe);}
    body.chat-open .brand{opacity:0;}
    body.chat-open .greeting{display:none;}
    .chat-panel{left:50%;right:auto;width:min(calc(100% - 24px),640px);height:auto;border-radius:22px;
      top:calc(var(--topSafe) + var(--swc) * .95);
      bottom:calc(env(safe-area-inset-bottom) + var(--dockGap) + var(--dockH) + 12px);
      padding-bottom:0;box-shadow:0 14px 44px rgba(27,34,51,.22);
      transform:translate(-50%,24px) scale(.98);opacity:0;visibility:hidden;pointer-events:none;}
    .chat-panel.open{transform:translate(-50%,0) scale(1);opacity:1;visibility:visible;pointer-events:auto;}
    .chat-grab{display:none;}
  }
  @media (orientation:portrait) and (max-height:700px){
    :root{--swc:min(40vw,19dvh);--topSafe:calc(env(safe-area-inset-top) + 72px);}
  }
  /* Tótem grande (p. ej. 1080×1920): todo un poco más grande para leer de pie */
  @media (orientation:portrait) and (min-width:700px){
    .dock{max-width:640px;padding:26px 26px 24px;gap:14px;border-radius:32px;}
    .greeting{font-size:36px;}
    .status{font-size:19px;min-height:26px;}
    .btn-primary{padding:24px 28px;font-size:22px;}
    .icon-btn{width:76px;height:76px;}
    .icon-btn svg{width:30px;height:30px;}
    .btn-ghost{padding:22px 34px;font-size:20px;}
    .chat-head h2{font-size:22px;} .chat-head h2 span{font-size:15px;}
    .msg .bubble{font-size:18px;padding:12px 18px;} .msg .who{font-size:13px;} .msg .time{font-size:12px;}
    .brand{font-size:13px;top:calc(env(safe-area-inset-top) + 96px);}
    .topbar{top:calc(env(safe-area-inset-top) + 24px);left:24px;right:24px;}
    .reset-btn{width:60px;height:60px;} .reset-btn svg{width:26px;height:26px;}
    .logo-badge{padding:14px 24px 14px 20px;gap:12px;border-radius:18px;}
    .logo{width:160px;}
    :root{--topSafe:calc(env(safe-area-inset-top) + 110px);}
  }
  /* Horizontal: el chat va a la derecha y Clarito + panel se corren a la izquierda */
  @media (orientation:landscape) and (min-width:700px){
    body.chat-open .stage{transform:translateX(calc(-50% - min(210px,21vw)));}
    body.chat-open .dock{transform:translateX(calc(-1 * min(210px,21vw)));}
  }
</style>
</head>

  <div id="bg" aria-hidden="true"></div>

  <div class="stage" aria-hidden="true">

const TXT={OFFLINE:'Pulsa el botón para hablar conmigo',IDLE:'Te escucho…',
  LISTENING:'Escuchando…',THINKING:'Pensando…',SPEAKING:'Hablando…',
  MIC_OFF:'Micrófono silenciado',MUTED:'En pausa (silenciado)'};
function setStatus(s){if(statusEl.dataset.s===s)return;statusEl.dataset.s=s;
  statusEl.textContent=TXT[s]||'';
  statusEl.classList.toggle('live', s==='LISTENING'||s==='THINKING'||s==='SPEAKING'||s==='MUTED'||s==='MIC_OFF');}
function showToast(html,ms=6500){toast.innerHTML=html;toast.classList.add('show');
  clearTimeout(showToast._t);if(ms)showToast._t=setTimeout(()=>toast.classList.remove('show'),ms);}

/* Boca (coordenadas en el espacio del avatar 1254×1254) */
const CX=625, cLx=554, cRx=696, topY=688;
function mouthSVG(o){
  if(o<0.06){
    return `<path d="M ${cLx},${topY} Q ${CX},${topY+30} ${cRx},${topY}" fill="none" stroke="#141414" stroke-width="13" stroke-linecap="round"/>`;
  }
  const botY=topY+14+o*62, wo=1-o*0.16;
  const lx=CX-(CX-cLx)*wo, rx=CX+(cRx-CX)*wo;
  const d=`M ${lx},${topY} Q ${CX},${topY-6} ${rx},${topY} Q ${rx-4},${botY} ${CX},${botY} Q ${lx+4},${botY} ${lx},${topY} Z`;
  let s=`<defs><clipPath id="mclip"><path d="${d}"/></clipPath></defs>`;
  s+=`<path d="${d}" fill="#3a0d0d"/>`;
  s+=`<g clip-path="url(#mclip)"><ellipse cx="${CX}" cy="${botY+4}" rx="${(rx-lx)*0.36}" ry="${10+o*20}" fill="#ff6f73"/></g>`;
  s+=`<path d="${d}" fill="none" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>`;
  return s;
}

let conversation=null,connected=false,agentMode='listening',previewState=null,lastUserSpoke=0,open=0;
let micMuted=false, outputMuted=false;
function frame(now){
  requestAnimationFrame(frame);
  let inVol=0,outVol=0;
  if(connected&&conversation){
    try{inVol=conversation.getInputVolume?.()??0;}catch(_){}
    try{outVol=conversation.getOutputVolume?.()??0;}catch(_){}
  }
  let s;
  if(previewState)s=previewState;
  else if(!connected)s='OFFLINE';
  else if(agentMode==='speaking')s='SPEAKING';
  else if(inVol>0.06){s='LISTENING';lastUserSpoke=now;}
  else if(lastUserSpoke&&now-lastUserSpoke<1600)s='THINKING';
  else s='IDLE';

  // Estado a mostrar (silencios tienen prioridad visual)
  let shown=s;
  if(connected&&outputMuted) shown='MUTED';
  else if(connected&&micMuted&&(s==='IDLE'||s==='LISTENING')) shown='MIC_OFF';
  setStatus(shown);

  const speaking=(s==='SPEAKING') && !outputMuted;
  let target=speaking?(outVol>0.01?Math.min(1,outVol*2.6):0.35+0.35*Math.abs(Math.sin(now/90))):0;
  open+=(target-open)*0.35;
  mouthG.innerHTML=mouthSVG(open);
}
requestAnimationFrame(frame);

let sdkPromise=null;
function loadSDK(){ if(!sdkPromise) sdkPromise=import('https://esm.sh/@elevenlabs/client').then(m=>m.Conversation); return sdkPromise; }
loadSDK().catch(()=>{sdkPromise=null;});            // precarga en segundo plano
let micOK=false;
async function ensureMic(){
  if(micOK) return true;
  try{
    const st=await navigator.permissions?.query({name:'microphone'});
    if(st&&st.state==='denied'){showToast('El micrófono está <b>bloqueado</b> para esta página. Actívalo en el candado de la barra de direcciones y vuelve a intentar.',9000);return false;}
  }catch(_){}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());               // solo para dejar el permiso concedido
    micOK=true; return true;
  }catch(e){console.error(e);showToast('Necesito permiso de <b>micrófono</b> para hablar contigo. Pulsa <b>Permitir</b> cuando el navegador lo pida.',9000);return false;}
}

async function startConversation(){
  if(!AGENT_ID.startsWith("agent_")){showToast('Falta tu <b>Agent ID</b> en el archivo.');return;}
  startBtn.disabled=true;startBtn.textContent='Conectando…';
  let Conversation;
  try{Conversation=await loadSDK();}
  catch(e){console.error(e);sdkPromise=null;reset();showToast('No se pudo cargar el SDK de ElevenLabs. Revisa tu internet.');return;}
  if(!(await ensureMic())){reset();return;}
  try{
    conversation=await Conversation.startSession({
      agentId:AGENT_ID, connectionType:'webrtc',
      onConnect:()=>{connected=true;addSeparator();lastUserSpoke=0;startBtn.style.display='none';endBtn.classList.add('show');
        micMuted=false;outputMuted=false;applyMic();applyOutput();
        micBtn.classList.add('show');quietBtn.classList.add('show');renderMuteBtns();reset();},
      onDisconnect:()=>cleanup(),
      onError:(err)=>{console.error(err);showToast('Problema con la conversación. Revisa que el agente sea <b>público</b> y el permiso de <b>micrófono</b>.');cleanup();},
      onModeChange:(m)=>{agentMode=(m&&m.mode)?m.mode:'listening';},
      onMessage:(ev)=>handleMessage(ev),
    });
  }catch(err){console.error(err);reset();
    showToast('No fue posible iniciar. Verifica: 1) <b>Agent ID</b>, 2) agente <b>público</b>, 3) permiso de <b>micrófono</b>.');}
}
async function endConversation(){try{await conversation?.endSession();}catch(_){}cleanup();}
function cleanup(){connected=false;agentMode='listening';conversation=null;endBtn.classList.remove('show');
  micBtn.classList.remove('show','active');quietBtn.classList.remove('show','active');
  micMuted=false;outputMuted=false;startBtn.style.display='inline-flex';reset();}

/* ---- Silenciar micrófono / silenciar a Clarito / reinicio ---- */
function applyMic(){ try{ (conversation?.setMicMuted||conversation?.setMuted)?.call(conversation,micMuted); }catch(e){console.error(e);} }
function applyOutput(){ try{ conversation?.setVolume?.({volume: outputMuted?0:1}); }catch(e){console.error(e);} }
function renderMuteBtns(){
  micBtn.innerHTML = micMuted?MIC_OFF:MIC_ON;
  micBtn.classList.toggle('active',micMuted);
  micBtn.title = micMuted?'Activar micrófono':'Silenciar micrófono';
  quietBtn.innerHTML = HAND;
  quietBtn.classList.toggle('active',outputMuted);
  quietBtn.title = outputMuted?'Reanudar a Clarito':'Silenciar a Clarito';
}
micBtn.addEventListener('click',()=>{ if(!connected)return; micMuted=!micMuted; applyMic(); renderMuteBtns(); });
quietBtn.addEventListener('click',()=>{ if(!connected)return; outputMuted=!outputMuted; applyOutput(); renderMuteBtns(); });
resetBtn.addEventListener('click',()=>softReset());

/* ---- Transcripción de la conversación ---- */
const chatBtn=$('chatBtn'),chatPanel=$('chatPanel'),chatBackdrop=$('chatBackdrop'),chatClose=$('chatClose'),
      chatList=$('chatList'),chatEmpty=$('chatEmpty'),chatBadge=$('chatBadge');
let chatOpen=false,unread=0,msgCount=0,sessionCount=0;
function hhmm(){return new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});}
function updateBadge(){chatBadge.textContent=unread>9?'9+':unread;chatBadge.classList.toggle('show',unread>0&&!chatOpen);}
function addSeparator(){sessionCount++;if(msgCount===0)return;
  const d=document.createElement('div');d.className='chat-sep';d.textContent='Nueva conversación · '+hhmm();chatList.appendChild(d);}
function addMessage(role,text){
  text=(text||'').replace(/\[[^\]]*\]/g,'').replace(/\s{2,}/g,' ').trim();
  if(!/[\p{L}\p{N}]/u.test(text))return; // ignora vacíos o solo "..."
  chatEmpty.style.display='none';msgCount++;
  const m=document.createElement('div');m.className='msg '+(role==='user'?'user':'ai');
  const who=document.createElement('div');who.className='who';who.textContent=role==='user'?'Tú':'Clarito';
  const b=document.createElement('div');b.className='bubble';b.textContent=text;
  const t=document.createElement('div');t.className='time';t.textContent=hhmm();
  m.append(who,b,t);chatList.appendChild(m);
  chatList.scrollTop=chatList.scrollHeight;
  if(!chatOpen){unread++;updateBadge();}
}
function handleMessage(ev){
  if(!ev)return;
  const text=ev.message??ev.text??'';
  const r=(ev.source||ev.role||'').toString().toLowerCase();
  addMessage(r==='user'?'user':'ai',text);
}
function openChat(){chatOpen=true;document.body.classList.add('chat-open');chatPanel.classList.add('open');chatBackdrop.classList.add('open');
  chatPanel.setAttribute('aria-hidden','false');chatBtn.setAttribute('aria-expanded','true');
  unread=0;updateBadge();chatList.scrollTop=chatList.scrollHeight;setTimeout(()=>chatClose.focus(),50);}
function closeChat(){chatOpen=false;document.body.classList.remove('chat-open');chatPanel.classList.remove('open');chatBackdrop.classList.remove('open');
  chatPanel.setAttribute('aria-hidden','true');chatBtn.setAttribute('aria-expanded','false');chatBtn.focus();}
chatBtn.addEventListener('click',()=>chatOpen?closeChat():openChat());
chatClose.addEventListener('click',closeChat);
chatBackdrop.addEventListener('click',closeChat);
addEventListener('keydown',e=>{if(e.key==='Escape'&&chatOpen)closeChat();});

async function softReset(){
  if(conversation){ try{await conversation.endSession();}catch(_){} }
  cleanup();
  if(typeof closeChat==='function'&&chatOpen) closeChat();
  chatList.querySelectorAll('.msg,.chat-sep').forEach(n=>n.remove());
  chatEmpty.style.display=''; msgCount=0; unread=0; updateBadge();
  previewState=null; toast.classList.remove('show');
  showToast('Listo, Clarito se reinició.',2200);
}
function reset(){startBtn.disabled=false;startBtn.textContent='🎤 Hablar con Clarito';}
startBtn.addEventListener('click',startConversation);
endBtn.addEventListener('click',endConversation);
addEventListener('keydown',e=>{const m={'1':'LISTENING','2':'THINKING','3':'SPEAKING','4':'IDLE'};
  if(m[e.key])previewState=m[e.key];if(e.key==='0')previewState=null;});
</script>
</body>
</html>
